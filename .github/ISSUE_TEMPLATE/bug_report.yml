name: Bug report
description: Report a reproducible problem without sharing athlete health data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach raw FIT, GPX, TCX, XLSX, HTML, PDF, JSON, coordinates, activity IDs, or identifiable health data. Use the smallest synthetic example that reproduces the issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or workflow
      description: Include the command and sanitized arguments, or describe the Skill workflow used.
      render: shell
    validations:
      required: true
  - type: textarea
    id: synthetic_input
    attributes:
      label: Synthetic reproduction
      description: Provide synthetic schema/rows or a minimal non-identifiable example.
    validations:
      required: false
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.5"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all athlete-identifying and raw health data.
          required: true
