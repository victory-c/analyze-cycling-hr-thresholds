name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/requirements-garmin-direct.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Smoke-test optional direct Garmin backend
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install -r scripts/requirements-garmin-direct.txt
          python scripts/fetch_garmin.py --help

      - name: Check skill frontmatter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path("SKILL.md").read_text(encoding="utf-8")
          match = re.match(r"^---\n(.*?)\n---\n", text, re.DOTALL)
          assert match, "SKILL.md must start with YAML frontmatter"
          frontmatter = match.group(1)
          assert re.search(r"^name:\s*analyze-cycling-hr-thresholds\s*$", frontmatter, re.MULTILINE)
          assert re.search(r"^description:\s*\S.+$", frontmatter, re.MULTILINE)
          PY
